<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Bahan Ajar UT</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <h1>Sistem Pemesanan Bahan Ajar Universitas Terbuka</h1>
        <nav>
            <button :class="{ 'active-tab': currentTab === 'stok' }" @click="currentTab = 'stok'">Stok Bahan Ajar</button>
            <button :class="{ 'active-tab': currentTab === 'tracking' }" @click="currentTab = 'tracking'">Tracking DO</button>
        </nav>

        <!-- view stok -->
        <div v-if="currentTab === 'stok' && dataLoaded">
            <ba-stock-table 
                :stok-data="appData.stok" 
                :upbjj-list="appData.upbjjList" 
                :kategori-list="appData.kategoriList"
                @update-stok="handleUpdateStok">
            </ba-stock-table>
        </div>

        <!-- view tracking -->
        <div v-if="currentTab === 'tracking' && dataLoaded">
            <do-tracking 
                :tracking-data="appData.tracking" 
                :paket-list="appData.paket" 
                :pengiriman-list="appData.pengirimanList"
                @update-tracking="handleUpdateTracking">
            </do-tracking>
        </div>
    </div>

    <!-- template injeksi dari folder /templates -->
    <template id="tpl-stock">
        <div class="stock-container">
    <h3>Filter & Sort Stok</h3>
    <div class="filter-section">
        <select v-model="filterUpbjj">
            <option value="">-- Pilih UT Daerah --</option>
            <option v-for="upbjj in upbjjList" :value="upbjj">{{ upbjj }}</option>
        </select>
        
        <!-- filter kategori hanya aktif jika UT Daerah dipilih (Dependent options) -->
        <select v-model="filterKategori" :disabled="!filterUpbjj">
            <option value="">-- Pilih Kategori --</option>
            <option v-for="kat in kategoriList" :value="kat">{{ kat }}</option>
        </select>

        <label>
            <input type="checkbox" v-model="filterWarning"> 
            Hanya tampilkan stok menipis/kosong
        </label>
        
        <select v-model="sortBy">
            <option value="">-- Urutkan Berdasarkan --</option>
            <option value="judul">Nama Mata Kuliah</option>
            <option value="qty">Jumlah Stok</option>
            <option value="harga">Harga</option>
        </select>
        <button @click="resetFilter">Reset Filter</button>
    </div>

    <h3>Daftar Stok Bahan Ajar</h3>
    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>Kode</th>
                <th>Nama Matkul</th>
                <th>Kategori</th>
                <th>UT-Daerah</th>
                <th>Lokasi Rak</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Safety</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="(item, index) in filteredAndSortedStok" :key="item.kode">
                <td>{{ item.kode }}</td>
                <td>{{ item.judul }}</td>
                <td>{{ item.kategori }}</td>
                <td>{{ item.upbjj }}</td>
                <td>{{ item.lokasiRak }}</td>
                <td>{{ formatRp(item.harga) }}</td>
                <td>{{ item.qty }} buah</td>
                <td>{{ item.safety }} buah</td>
                <td :class="statusClass(item.qty, item.safety)" :title="stripHtml(item.catatanHTML)">
                    {{ statusText(item.qty, item.safety) }}
                </td>
                <td>
                    <button @click="editItem(item)">Edit</button>
                    <button @click="deleteItem(item.kode)">Hapus</button>
                </td>
            </tr>
        </tbody>
    </table>

    <hr>
    <h3>{{ isEditing ? 'Edit' : 'Tambah' }} Bahan Ajar</h3>
    <small><i>Tekan 'Enter' pada field terakhir untuk menyimpan data.</i></small>
    <div class="form-section" @keyup.enter="saveData">
        <input type="text" v-model="formData.kode" placeholder="Kode Matkul" :disabled="isEditing">
        <input type="text" v-model="formData.judul" placeholder="Nama Mata Kuliah">
        <select v-model="formData.kategori">
            <option v-for="kat in kategoriList" :value="kat">{{ kat }}</option>
        </select>
        <select v-model="formData.upbjj">
            <option v-for="upbjj in upbjjList" :value="upbjj">{{ upbjj }}</option>
        </select>
        <input type="text" v-model="formData.lokasiRak" placeholder="Lokasi Rak (e.g. R1-A3)">
        <input type="number" v-model="formData.harga" placeholder="Harga">
        <input type="number" v-model="formData.qty" placeholder="Jumlah Stok">
        <input type="number" v-model="formData.safety" placeholder="Safety Stock">
    </div>
</div>
    </template>
    
    <template id="tpl-tracking">
        <div class="tracking-container">
    <h3>Tracking Delivery Order</h3>
    <input type="text" v-model="searchQuery" @keyup.enter="searchDO" @keyup.esc="clearSearch" placeholder="Cari No DO / NIM lalu Enter (Esc utk reset)" class="search-box">
    
    <div v-if="searchResult" class="result-card">
        <h4>Hasil Pencarian: {{ searchResult.id }}</h4>
        <p><strong>Nama:</strong> {{ searchResult.data.nama }} ({{ searchResult.data.nim }})</p>
        <p><strong>Status:</strong> {{ searchResult.data.status }}</p>
        
        <ul>
            <li v-for="j in searchResult.data.perjalanan">
                {{ j.waktu }} - {{ j.keterangan }}
            </li>
        </ul>
        <div class="add-progress">
            <input type="text" v-model="newProgress" placeholder="Keterangan progress baru">
            <button @click="addProgress">Tambah Progress</button>
        </div>
    </div>

    <hr>
    <h3>Buat Delivery Order Baru</h3>
    <div class="form-section">
        <p><strong>No DO:</strong> {{ newDO.id }} <i>(Otomatis)</i></p>
        <input type="text" v-model="newDO.nim" placeholder="NIM">
        <input type="text" v-model="newDO.nama" placeholder="Nama Mahasiswa">
        <select v-model="newDO.ekspedisi">
            <option value="">-- Pilih Ekspedisi --</option>
            <option v-for="eks in pengirimanList" :value="eks.nama">{{ eks.nama }}</option>
        </select>
        
        <select v-model="newDO.paket" @change="updateTotalHarga">
            <option value="">-- Pilih Paket Bahan Ajar --</option>
            <option v-for="p in paketList" :value="p.kode">{{ p.kode }} - {{ p.nama }}</option>
        </select>
        
        <!-- detail isi paket -->
        <div class="paket-detail" v-if="selectedPaketObj">
            <strong>Isi Paket:</strong> {{ selectedPaketObj.isi.join(', ') }}
        </div>

        <input type="date" v-model="newDO.tanggalKirim">
        <p><strong>Total Harga:</strong> {{ formatRp(newDO.total) }}</p>

        <button @click="submitDO">Buat DO Baru</button>
    </div>
</div>
    </template>

    <script src="js/services/api.js"></script>
    <script src="js/components/stock-table.js"></script>
    <script src="js/components/do-tracking.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
